name: ClinTrialist Report Aggregate

on:
  schedule:
    # 17:00 UTC daily = 12:00 PM EST / 1:00 PM EDT.
    # GitHub Actions cron is UTC year-round and does not follow DST.
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run aggregation
        run: python run.py

      - name: Commit and push
        run: |
          git config user.name "ClinTrialist Report Bot"
          git config user.email "clintrialist@gmail.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
